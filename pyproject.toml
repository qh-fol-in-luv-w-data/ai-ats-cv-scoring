[project]
name = "ai_ats"
authors = [
    { name = "CT Group", email = "dev@ctgroup.vn"}
]
description = "AI Candidate Persona Report System – NoAI-NoHire"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "openai>=1.0.0",
    "requests>=2.28.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ct_template]
prefix           = "ATS"
module           = "AI ATS"
app_name         = "ai_ats"
app_slug         = "ai_ats"
get_context_file = "ai_ats/api.py"
context_url      = "/api/method/ai_ats.api.get_context"
frontend_src     = "frontend/"
